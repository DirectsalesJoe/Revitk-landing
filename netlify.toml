[build]
  command = "pnpm install && pnpm build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

# Ensure static files are served directly before the catch-all redirect
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200

# Every page is its own file now (scripts/prerender.mjs writes offer.html and so
# on), so an address with no file is a real "not found" and says so. Before, any
# address at all was sent the homepage shell with a 200.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
